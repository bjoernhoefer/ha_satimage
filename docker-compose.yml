services:
  ha_satimage:
    image: ghcr.io/bjoernhoefer/ha_satimage:${HA_SATIMAGE_TAG:-latest}
    container_name: ha_satimage
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${HA_SATIMAGE_PORT:-6060}:6060"
    volumes:
      # Configuration (config.yaml), logs, cache and (by default) the frames.
      # Lives on the host, so it survives image updates and container
      # re-creation. Back it up by copying this directory.
      - ${HOST_DATA_DIR:-./data}:/data
      # Additional host disks (e.g. /mnt/data). The frame storage location
      # is chosen in the web UI ("Storage & history") - only paths below
      # mounted volumes are persistent. Use "/mnt:/mnt:rslave" if disks are
      # mounted after the container starts.
      - /mnt:/mnt
    environment:
      # UID/GID used for writing - must match the owner of the data
      # directories on the host (see `id` on the host).
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Optional: overrides the credentials stored via the UI.
      - EUMETSAT_CONSUMER_KEY=${EUMETSAT_CONSUMER_KEY:-}
      - EUMETSAT_CONSUMER_SECRET=${EUMETSAT_CONSUMER_SECRET:-}
    labels:
      # GitHub Actions deploys updates; false also blocks host-wide Watchtower.
      - com.centurylinklabs.watchtower.enable=false
    # Healthcheck is defined in the image (docker/Dockerfile).
    # Conservative limits so rendering does not starve other services on
    # small hosts such as a Raspberry Pi.
    mem_limit: ${HA_SATIMAGE_MEM_LIMIT:-768m}
    cpus: ${HA_SATIMAGE_CPUS:-1.5}
    # Includes native threads; tune from measured peak usage on the host.
    pids_limit: ${HA_SATIMAGE_PIDS_LIMIT:-128}
    # Do not let this container exhaust host swap (same value as RAM limit).
    memswap_limit: ${HA_SATIMAGE_MEM_LIMIT:-768m}
