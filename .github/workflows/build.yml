name: Build and publish container image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_targets:
        description: "Rollout targets (configured = repository variable DEPLOY_TARGETS, default pi)"
        type: choice
        options: [configured, pi, azure, both, none]
        default: configured

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ha_satimage
  DEPLOY_IMAGE_NAME: ${{ github.repository_owner }}/ha_satellite

permissions:
  contents: read

jobs:
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read app version
        run: echo "APP_VERSION=$(sed -n 's/^__version__ = \"\(.*\)\"/\1/p' src/ha_satimage/__init__.py)" >> "$GITHUB_ENV"

      - name: Metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ env.DEPLOY_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.APP_VERSION }},enable={{is_default_branch}}

      - name: Build (and push, except for PRs)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  targets:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve rollout targets
        id: resolve
        env:
          REQUESTED: ${{ inputs.deploy_targets }}
          CONFIGURED: ${{ vars.DEPLOY_TARGETS }}
        shell: bash
        run: |
          set -euo pipefail
          set -f
          requested="${REQUESTED:-configured}"
          if [[ "$requested" == "configured" ]]; then
            requested="${CONFIGURED:-pi}"
          fi
          requested="${requested,,}"
          if [[ ! "$requested" =~ ^[a-z,[:space:]]+$ ]]; then
            echo "::error::Invalid rollout targets (allowed: pi, azure, both, none; comma-separated)"
            exit 1
          fi
          pi=false
          azure=false
          for target in ${requested//,/ }; do
            case "$target" in
              pi) pi=true ;;
              azure) azure=true ;;
              both) pi=true; azure=true ;;
              none) ;;
              *)
                echo "::error::Unknown rollout target '$target' (allowed: pi, azure, both, none)"
                exit 1
                ;;
            esac
          done
          # Fixed allowlist: runner labels, sudo user and concurrency per host.
          entries=()
          names=()
          if [[ "$pi" == true ]]; then
            names+=(pi)
            entries+=('{"name":"pi","runs_on":["self-hosted","linux","ARM64","deploy-satellite"],"deploy_user":"bjoern","concurrency":"deploy-ha_satellite"}')
          fi
          if [[ "$azure" == true ]]; then
            names+=(azure)
            entries+=('{"name":"azure","runs_on":["self-hosted","linux","X64","deploy-satellite-azure"],"deploy_user":"ha-satimage","concurrency":"deploy-ha_satellite-azure"}')
          fi
          matrix="[$(IFS=,; echo "${entries[*]}")]"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          summary="Rollout targets: ${names[*]:-none}"
          echo "$summary"
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            echo "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: [build, targets]
    if: needs.targets.outputs.matrix != '[]'
    name: deploy (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.runs_on }}
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    concurrency:
      group: ${{ matrix.target.concurrency }}
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - name: Skip if superseded
        id: superseded
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA=$(git ls-remote --exit-code "https://github.com/${REPOSITORY}" refs/heads/main | cut -f1)
          if [[ -z "$MAIN_SHA" ]]; then
            echo "::error::Could not determine the current main SHA"
            exit 1
          fi
          if [[ "$MAIN_SHA" != "$GITHUB_SHA" ]]; then
            echo "::notice::Skipping superseded build $GITHUB_SHA (main is $MAIN_SHA)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.superseded.outputs.skip == 'false'
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.DEPLOY_IMAGE_NAME }}
          DEPLOY_USER: ${{ matrix.target.deploy_user }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid image digest"
            exit 1
          fi
          if [[ ! "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]; then
            echo "::error::Invalid deploy user"
            exit 1
          fi
          sudo -n -u "$DEPLOY_USER" /usr/local/bin/ha-deploy ha_satellite "${IMAGE}@${DIGEST}" "${GITHUB_SHA}"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,ui]"

      - name: Verify version (tag must match __version__)
        run: |
          VERSION=$(python -c "import ha_satimage; print(ha_satimage.__version__)")
          echo "Version: $VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match version $VERSION"; exit 1
          fi

      - name: Install Chromium for UI click tests
        run: playwright install --with-deps chromium

      - name: Run tests (including UI click tests)
        env:
          HA_SATIMAGE_REQUIRE_UI_TESTS: "1"
        run: pytest -q --tracing retain-on-failure
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
