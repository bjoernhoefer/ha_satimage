[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha_satimage"
version = "1.7.0"
description = "EUMETSAT satellite images as camera entities for Home Assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "apscheduler>=3.10",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pillow>=10.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "numpy>=1.26",
    # EUMETSAT download + Satpy rendering. In the Docker image these packages
    # come as prebuilt wheels (see docker/Dockerfile).
    "eumdac>=3.0",
    "satpy>=0.60",
    "pyresample>=1.34",
    "pyproj>=3.6",
    "dask[array]>=2024.1",
    # Satpy reader fci_l1c_nc (MTG FCI) reads NetCDF4.
    "netCDF4>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# Browser click tests of the web UI; additionally run `playwright install chromium`.
ui = [
    "pytest-playwright>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ha_satimage = ["templates/*.html", "static/*.svg", "satpy_config/composites/*.yaml", "overlay_data/*.json.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "keep_folded: UI test that keeps the collapsible page sections closed",
    "ui: browser click tests of the web UI (require the [ui] extra and Chromium)",
]
